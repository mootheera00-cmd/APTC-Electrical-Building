<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APTC · Point Status State Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-soft:#7a8399;--color-accent:#eb6c36;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
html,body{overflow-x:clip}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1100px;width:100%}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:.25rem}
.sub{color:var(--color-muted);font-size:.9rem;margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
footer{margin-top:1.5rem;border-top:1px solid rgba(45,49,66,.12);padding-top:.75rem;font-family:var(--font-mono);font-size:.7rem;color:var(--color-soft)}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">State machine · APTC-Electrical and Building · req. 5–6</p>
<h1>Point status lifecycle</h1>
<p class="sub">Status is computed per point: the newest open report wins, otherwise normal. Closing returns the point to normal.</p>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aptc-state-title aptc-state-desc">
<title id="aptc-state-title">APTC point status state machine</title>
<desc id="aptc-state-desc">State machine with five states: normal, reported, waiting, repairing, done, and the events that move a point between them.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<!-- start dot -->
<circle cx="24" cy="232" r="6" fill="#2d3142"/>
<line x1="30" y1="232" x2="40" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- forward transitions -->
<line x1="200" y1="232" x2="220" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="380" y1="232" x2="400" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="560" y1="232" x2="580" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="740" y1="232" x2="760" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- close loop: done bottom -> left -> normal bottom -->
<path d="M840,264 L840,344 Q840,352 832,352 L128,352 Q120,352 120,344 L120,264" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<!-- labels, masks 8px above lines -->
<rect x="176" y="204" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="210" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">REPORT</text>
<rect x="356" y="204" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="390" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">ACCEPT</text>
<rect x="536" y="204" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="570" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">START</text>
<rect x="712" y="204" width="76" height="12" rx="2" fill="#f5f5f5"/>
<text x="750" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">FINISH</text>
<rect x="452" y="332" width="96" height="12" rx="2" fill="#f5f5f5"/>
<text x="500" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CLOSE / AUTO</text>
<!-- states -->
<rect x="40" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="120" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">normal</text>
<text x="120" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">green · no open job</text>
<rect x="220" y="200" width="160" height="64" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="300" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">reported</text>
<text x="300" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">amber · needs triage</text>
<rect x="400" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">waiting</text>
<text x="480" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">orange · queued</text>
<rect x="580" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="660" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">repairing</text>
<text x="660" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">blue · work in progress</text>
<rect x="760" y="200" width="160" height="64" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="840" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">done</text>
<text x="840" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">slate · closed, in history</text>
<!-- note -->
<text x="500" y="400" fill="#7a8399" font-size="12" font-style="italic" font-family="'Instrument Serif',serif" text-anchor="middle">Marker colour + icon + label on the plan always mirror this state.</text>
<!-- legend -->
<line x1="40" y1="460" x2="960" y2="460" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND</text>
<circle cx="52" cy="492" r="6" fill="#2d3142"/>
<text x="68" y="496" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Start</text>
<rect x="160" y="484" width="60" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="228" y="496" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">State</text>
<line x1="320" y1="492" x2="348" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="356" y="496" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Transition (event)</text>
<line x1="560" y1="492" x2="588" y2="492" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="596" y="496" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Return (transit)</text>
<rect x="760" y="484" width="60" height="16" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="828" y="496" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Needs attention</text>
</svg>
<footer>APTC-Electrical and Building · flow-status-state · diagram-design default skin</footer>
</div>
</body>
</html>
