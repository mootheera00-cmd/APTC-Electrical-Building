<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APTC · Report-to-Repair Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--color-paper:#f5f5f5;--color-ink:#2d3142;--color-muted:#4f5d75;--color-soft:#7a8399;--color-accent:#eb6c36;--font-sans:'Geist',system-ui,sans-serif;--font-serif:'Instrument Serif',serif;--font-mono:'Geist Mono',ui-monospace,monospace}
html,body{overflow-x:clip}
body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1100px;width:100%}
.eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem}
h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:.25rem}
.sub{color:var(--color-muted);font-size:.9rem;margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
footer{margin-top:1.5rem;border-top:1px solid rgba(45,49,66,.12);padding-top:.75rem;font-family:var(--font-mono);font-size:.7rem;color:var(--color-soft)}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flowchart · APTC-Electrical and Building · F1–F3</p>
<h1>Report fault to done</h1>
<p class="sub">Click a point on the plan (e.g. L-005) → report → triage → repair or replace → done. History stays on the point.</p>
<svg viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aptc-flow-title aptc-flow-desc">
<title id="aptc-flow-title">APTC report-to-repair flowchart</title>
<desc id="aptc-flow-desc">Flowchart from clicking an install point through fault reporting, triage, optional unit replacement, repair recording, to done.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<!-- arrows first -->
<line x1="500" y1="84" x2="500" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="620" y1="176" x2="740" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="500" y1="236" x2="500" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="500" y1="332" x2="500" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="500" y1="420" x2="500" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="620" y1="512" x2="720" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="500" y1="572" x2="500" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="820" y1="540" x2="820" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="590" y1="668" x2="590" y2="700" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<!-- labels with 6px+ gap -->
<rect x="644" y="156" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="656" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
<rect x="448" y="248" width="32" height="12" rx="2" fill="#f5f5f5"/>
<text x="464" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
<rect x="644" y="492" width="32" height="12" rx="2" fill="#f5f5f5"/>
<text x="660" y="501" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
<rect x="516" y="584" width="24" height="12" rx="2" fill="#f5f5f5"/>
<text x="528" y="593" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
<!-- start -->
<rect x="400" y="36" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="500" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Click point on plan</text>
<text x="500" y="74" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">e.g. L-005</text>
<!-- D1 -->
<polygon points="500,116 620,176 500,236 380,176" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="172" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Fault</text>
<text x="500" y="186" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">found?</text>
<!-- back end -->
<rect x="740" y="152" width="180" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="830" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Back to plan</text>
<text x="830" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">view history only</text>
<!-- submit -->
<rect x="380" y="276" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Submit fault report</text>
<text x="500" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">symptom · photo · reporter</text>
<!-- triage -->
<rect x="380" y="364" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Triage to repairing</text>
<text x="500" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">reported → waiting → repairing</text>
<!-- D2 -->
<polygon points="500,452 620,512 500,572 380,512" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="508" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Replace</text>
<text x="500" y="522" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">unit?</text>
<!-- replace -->
<rect x="720" y="484" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="820" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Replace unit</text>
<text x="820" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">history kept on point</text>
<!-- record -->
<rect x="340" y="612" width="500" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="590" y="636" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Record repair</text>
<text x="590" y="652" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">technician · cost · attachment</text>
<!-- done focal -->
<rect x="490" y="700" width="200" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="590" y="724" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Done</text>
<text x="590" y="740" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">point back to normal</text>
<!-- legend -->
<line x1="40" y1="800" x2="960" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="816" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>
<rect x="40" y="828" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="72" y="838" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Start / end</text>
<rect x="220" y="828" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="252" y="838" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Step</text>
<polygon points="412,834 424,828 436,834 424,840" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="448" y="838" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Decision</text>
<line x1="604" y1="836" x2="632" y2="836" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="640" y="838" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">Close-out path</text>
</svg>
<footer>APTC-Electrical and Building · flow-report-repair · diagram-design default skin</footer>
</div>
</body>
</html>
